# Preserve modified Enter keys for terminal applications (tmux 3.5+).
set -s extended-keys on
set -s extended-keys-format csi-u

# Enable mouse selection, resizing, and scrolling.
set -g mouse on

# Disable window switching by scrolling over the status bar.
unbind-key -T root WheelUpStatus
unbind-key -T root WheelDownStatus

# Plugin manager, session saving, and automatic backups.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore saved sessions when tmux starts.
set -g @continuum-restore 'on'

# Prevent applications from renaming windows.
set-option -g allow-rename off

# Use the default Ctrl+b prefix; press twice to send Ctrl+b.
unbind C-a
set -g prefix C-b
bind C-b send-prefix

# Prefix + | splits side by side; prefix + - splits top/bottom.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
# Prefix + r reloads this config.
unbind r
bind r source-file ~/.tmux.conf

# Number windows and panes from 1; close gaps after removing windows.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Rose Pine Moon status bar: one row at the top.
set -g status-position top
set -g status on
set -g status-justify left
set -g status-style "fg=#e0def4,bg=#232136"

# Match tabline.wez: RAM in GB, CPU percentage, and a bold hostname.
# Read the macOS page size instead of assuming 4 KiB; retain Linux support.
set -g @status-ram "#(if command -v vm_stat >/dev/null 2>&1; then vm_stat | LC_NUMERIC=C awk '/page size/ {page=\$8} /Anonymous pages:|Pages wired down:|Pages occupied by compressor:/ {used+=\$NF} /Pages purgeable:/ {used-=\$NF} END {printf \"%%.2f GB\", used*page/1073741824}'; else free -m | LC_NUMERIC=C awk '/^Mem:/ {printf \"%%.2f GB\", \$3/1000}'; fi)"
set -g @cpu_percentage_format '%.2f%%'
set -g status-interval 15

# Rose Pine Moon: neutral clock, then Foam, Gold, and Iris segments.
# Rounded left edges connect directly to the previous segment's color.
set -g status-left ""
set -g status-left-length 0
set -g status-right "#[fg=#e0def4,bg=#232136,nobold]%Y-%m-%d %H:%M "
set -ag status-right "#[fg=#9ccfd8,bg=#232136]#[fg=#232136,bg=#9ccfd8,nobold]  #{E:@status-ram} "
set -ag status-right "#[fg=#f6c177,bg=#9ccfd8]#[fg=#232136,bg=#f6c177,nobold]  #{cpu_percentage} "
set -ag status-right "#[fg=#c4a7e7,bg=#f6c177]#[fg=#232136,bg=#c4a7e7,bold] 󰌢 #h #[default]"
set -g status-right-length 80

# Show window numbers and names; match the WezTerm tab colors.
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#908caa,bg=#232136,nobold] #I: #W "
setw -g window-status-current-format "#[fg=#e0def4,bg=#393552,bold] #I: #W "

# Use Moon colors for pane borders, prompts, and copy-mode selection.
set -g pane-border-style "fg=#56526e"
set -g pane-active-border-style "fg=#f6c177"
set -g message-style "fg=#e0def4,bg=#232136,fill=#232136"
set -g message-command-style "fg=#232136,bg=#f6c177,fill=#f6c177"
setw -g mode-style "fg=#e0def4,bg=#56526e"

# Load plugins after their settings.
run '~/.tmux/plugins/tpm/tpm'
